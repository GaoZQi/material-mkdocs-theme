site_name: Rounded主题
site_url: https://GaoZQi.github.io/material-mkdocs-theme # 网站地址

repo_name: material-mkdocs-theme # 仓库名称
repo_url: https://github.com/GaoZQi/material-mkdocs-theme # 仓库地址

theme:
    name: "material" # 主题名称
    language: "zh" # 网站语言
    favicon: images/icon.png # 网站图标
    icon: # 网站图标
        logo: material/shape-square-rounded-plus

    features: # 特性
        - content.code.annotate # 代码注释
        - navigation.tracking # 导航栏跟踪
        - navigation.tabs # 导航栏标签
        - navigation.indexes # 导航栏索引
        - navigation.top # 导航栏顶部
        - content.code.copy # 代码复制
        - content.code.annotate # 代码注释
        - navigation.footer # 导航栏底部
        - navigation.sections
        - navigation.expand #目录展开
        - navigation.path
        - toc.follow
        - content.tooltips

    palette:
        scheme: auto

    custom_dir: docs/resources

extra_css:
    - theme/css/import.css

extra_javascript:
    - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
    - heti

    - glightbox:
          touchNavigation: true
          loop: false
          effect: zoom
          slide_effect: slide
          width: 100%
          height: auto
          zoomable: true
          draggable: true
          skip_classes:
              - skip-lightbox
          auto_caption: false
          caption_position: bottom
          background: white
          shadow: true
          manual: false
    - search

    - git-revision-date-localized:
          type: timeago
          timezone: Asia/Shanghai
          locale: zh
          enable_creation_date: true

markdown_extensions:
    - abbr # 缩写
    - pymdownx.snippets # 代码块
    - pymdownx.highlight: # 代码高亮
          anchor_linenums: true # 代码行号
    - pymdownx.inlinehilite # 行内代码高亮
    - pymdownx.superfences # 内置标题栏
    - attr_list # 属性列表
    - md_in_html
    - attr_list
    - footnotes # 脚注

    - toc: # 目录
          # permalink: "↗" # 目录链接
          toc_depth: 4 # 目录深度
    - meta # 元数据
    - def_list # 定义列表
    - attr_list # 属性列表
    - md_in_html # HTML中的Markdown
    - sane_lists # 列表
    - admonition # 警告

    - pymdownx.keys # 键盘
    - pymdownx.mark # 标记
      # 格式化处理
    - pymdownx.caret # 上标
    - pymdownx.keys # 键盘
    - pymdownx.mark # 标记
    - pymdownx.tilde # 删除线
    - pymdownx.critic # 评论

    - pymdownx.details # 详情
    - pymdownx.magiclink # 链接
    - tables # 表格
    - meta

    - pymdownx.tabbed: # 标签
          alternate_style: true # 标签样式
    - pymdownx.tasklist: # 任务列表
          custom_checkbox: true # 自定义复选框
    - pymdownx.arithmatex: # 数学公式
          generic: true # 通用
    - pymdownx.emoji: # emoji
          emoji_index:
              !!python/name:material.extensions.emoji.twemoji # emoji索引


          emoji_generator: !!python/name:material.extensions.emoji.to_svg

    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format

nav:
    - index.md # 首页
    - 安装: ./pages/start/index.md
    - 组件:
          - ./pages/module/index.md
          - 基础组件: ./pages/module/basic.md
          - 拓展组件: ./pages/module/extend.md
          - 插件组件:
                - ./pages/module/plugins/index.md
                - goverlay: ./pages/module/plugins/goverlay.md
