site_name: Rounded主题
site_url: https://GaoZQi.github.io/material-mkdocs-theme # 网站地址

repo_name: material-mkdocs-theme # 仓库名称
repo_url: https://github.com/GaoZQi/material-mkdocs-theme # 仓库地址

theme:
    name: "material" # 主题名称
    language: "zh" # 网站语言
    favicon: images/icon.png # 网站图标
    icon: # 网站图标
        logo: material/shape-square-rounded-plus

    features: # 特性
        - content.code.annotate # 代码注释
        - navigation.tracking # 导航栏跟踪
        - navigation.tabs # 导航栏标签
        - navigation.indexes # 导航栏索引
        - navigation.top # 导航栏顶部
        - content.code.copy # 代码复制
        - content.code.annotate # 代码注释
        - navigation.footer # 导航栏底部
        - navigation.sections
        - navigation.expand #目录展开
        - navigation.path
        - toc.follow
        - content.tooltips

    palette:
        # Palette toggle for automatic mode
        - media: "(prefers-color-scheme: auto)"
          scheme: auto
          toggle:
              icon: material/lightbulb-auto-outline
              name: 切换为浅色模式

        # Palette toggle for light mode
        - media: "(prefers-color-scheme: light)"
          scheme: default
          toggle:
              icon: octicons/sun-16
              name: 切换为深色模式

        # Palette toggle for dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          toggle:
              icon: octicons/moon-16
              name: 切换为自动模式

    custom_dir: docs/resources

extra_css:
    - theme/css/import.css

extra_javascript:
    - resources/javascript/mathjax.js
    - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
    - glightbox:
          touchNavigation: true
          loop: false
          effect: zoom
          slide_effect: slide
          width: 100%
          height: auto
          zoomable: true
          draggable: true
          skip_classes:
              - skip-lightbox
          auto_caption: false
          caption_position: bottom
          background: white
          shadow: true
          manual: false
    - search

    - git-revision-date-localized:
          type: timeago
          timezone: Asia/Shanghai
          locale: zh
          enable_creation_date: true

    - git-committers:
          repository: GaoZQi/material-mkdocs-theme
          branch: docs
          exclude_committers:
              - "web-flow"
    - encryptcontent:
          reload_scripts:
              - resources/javascript/mathjax.js
              - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

          password_button: True
          password_button_text: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><!--! Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free (Icons: CC BY 4.0, Fonts: SIL OFL 1.1, Code: MIT License) Copyright 2024 Fonticons, Inc.--><path d="M144 144c0-44.2 35.8-80 80-80 31.9 0 59.4 18.6 72.3 45.7 7.6 16 26.7 22.8 42.6 15.2s22.8-26.7 15.2-42.6C331 33.7 281.5 0 224 0 144.5 0 80 64.5 80 144v48H64c-35.3 0-64 28.7-64 64v192c0 35.3 28.7 64 64 64h320c35.3 0 64-28.7 64-64V256c0-35.3-28.7-64-64-64H144z"></path></svg> 解锁'
          title_prefix: ""
          summary: "限制访问！"
          placeholder: "请输入口令"
          decryption_failure_message: "⚠ 错误！"
          encryption_info_message: '如需访问该内容，请输入正确口令。</p><p id="mkdocs-decrypt-msg">'
          encrypted_something:
              # md-footer__inner: [nav, class]
              md-nav md-nav--secondary: [nav, class]
              # md-nav__list: [ul, class]
              # md-nav__title: [lable, class]
              # md-nav: [nav, class]
              # md-sidebar__inner: [div, class]

markdown_extensions:
    - abbr # 缩写
    - pymdownx.snippets # 代码块
    - pymdownx.highlight: # 代码高亮
          anchor_linenums: true # 代码行号
    - pymdownx.inlinehilite # 行内代码高亮
    - pymdownx.superfences # 内置标题栏
    - attr_list # 属性列表
    - md_in_html
    - attr_list
    - footnotes # 脚注

    - toc: # 目录
          permalink: "⤴" # 目录链接
          toc_depth: 4 # 目录深度
    - meta # 元数据
    - def_list # 定义列表
    - attr_list # 属性列表
    - md_in_html # HTML中的Markdown
    - sane_lists # 列表
    - admonition # 警告

    - pymdownx.keys # 键盘
    - pymdownx.mark # 标记
      # 格式化处理
    - pymdownx.caret # 上标
    - pymdownx.keys # 键盘
    - pymdownx.mark # 标记
    - pymdownx.tilde # 删除线
    - pymdownx.critic # 评论

    - pymdownx.details # 详情
    - pymdownx.magiclink # 链接
    - tables # 表格
    - meta
    - pymdownx.blocks.html
    - pymdownx.tabbed: # 标签
          alternate_style: true # 标签样式
    - pymdownx.tasklist: # 任务列表
          custom_checkbox: true # 自定义复选框
    - pymdownx.arithmatex: # 数学公式
          generic: true # 通用
    - pymdownx.emoji: # emoji
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg

    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format

nav:
    - index.md # 首页
    - 安装: ./pages/start/index.md
    - 组件:
          - ./pages/module/index.md
          - 基础组件: ./pages/module/basic.md
          - 拓展组件: ./pages/module/extend.md
          - 插件组件:
                - ./pages/module/plugins/index.md
                - goverlay: ./pages/module/plugins/goverlay.md
                - encryptcontent: ./pages/module/plugins/encryptcontent.md
